[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-backend"
version = "1.0.0"
description = "OpenClaw Skills Hub API"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # FastAPI Depends() in defaults is standard pattern
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "app.models.*"
disallow_untyped_defs = false

# SQLModel/SQLAlchemy 类型存根不完善，忽略以下模块的类型检查错误
[[tool.mypy.overrides]]
module = [
    "app.services.skill_service",
    "app.services.rating_service",
    "app.services.notification_service",
    "app.services.favorite_service",
    "app.services.comment_service",
    "app.api.v1.admin",
    "app.api.v1.users",
]
# 这些错误是 SQLModel 类型存根问题，代码逻辑正确（测试通过）
disable_error_code = ["attr-defined", "arg-type", "call-overload", "no-any-return"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "-v --cov=app --cov-report=term-missing --cov-report=html"
markers = [
    "unit: 单元测试",
    "integration: 集成测试",
]
